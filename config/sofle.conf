# CONFIG_ZMK_KEYBOARD_NAME="sofle-peixoto"

# Uncomment the following line to enable the Sofle OLED Display
#CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=y
#CONFIG_ZMK_WIDGET_WPM_STATUS=y
#CONFIG_ZMK_WIDGET_LAYER_STATUS=y
#CONFIG_ZMK_WIDGET_PERIPHERAL_STATUS=y
#CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y
#CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# Seems that only the 128x32 config for zmk-dongle-display is supported for my 0.91" display. F
CONFIG_ZMK_DONGLE_DISPLAY_BONGO_CAT=n
CONFIG_ZMK_DONGLE_DISPLAY_MODIFIERS=n
CONFIG_ZMK_DONGLE_DISPLAY_LAYER=n

# Uncomment these two lines to add support for encoders
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Power saving tweaks (here be dragons)
# 2 minutes
CONFIG_ZMK_IDLE_TIMEOUT=120000
CONFIG_ZMK_SLEEP=y
# 5 minutes
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=300000
# CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400
# CONFIG_BT_PERIPHERAL_PREF_MIN_INT=40
# CONFIG_BT_PERIPHERAL_PREF_MAX_INT=80
# CONFIG_BT_PERIPHERAL_PREF_LATENCY=4

# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
# CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n
# CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=3
# CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=100
# CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n

# Uncomment the line below to disable external power toggling by the underglow.
# By default toggling the underglow on and off also toggles external power
# on and off. This also causes the display to turn off.
# CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n
